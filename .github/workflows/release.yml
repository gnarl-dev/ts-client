# Publishes @gnarl/client to npm when a v* tag is pushed, with provenance.
#
# npm trusts this workflow by name (trusted publishing), so no token is
# needed once the package exists. The very first publish of a new package
# cannot use it: set an NPM_TOKEN secret for that one release, then remove it
# and register this workflow as the package's trusted publisher.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@11.6.2
      - name: The tag names the version being published
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./package.json').version")
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $have"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs lint, typecheck, tests, build and the package check.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
