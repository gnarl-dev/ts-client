# Publishes gnarl-client to npm when a v* tag is pushed, with provenance.
#
# npm trusts this workflow by name (trusted publishing, OIDC): no token exists
# anywhere. The package's npm settings name gnarl-dev/ts-client, release.yml and
# environment `npm` as its trusted publisher, and disallow token publishing, so
# a leaked token could not publish even if one were created.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing needs npm 11.5 or later.
      - run: npm install -g npm@11.6.2
      - name: The tag names the version being published
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(node -p "require('./package.json').version")
          if [ "$want" != "$have" ]; then
            echo "::error::tag $GITHUB_REF_NAME but package.json says $have"
            exit 1
          fi
      - run: npm ci
      # prepublishOnly runs lint, typecheck, tests, build and the package check.
      - run: npm publish --provenance --access public
